<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="mcp-yoto logo">
  <title>mcp-yoto</title>
  <!-- Friendly rounded square, warm palette -->
  <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="#FF7A45"/>

  <!-- Chunky pixel-art play triangle: 8 rows on a 12x12 grid (cell = 32px,
       inset 64px), a right-pointing staircase triangle. Reads as "play"
       at every size, from 512 down to 16px. -->
  <rect x="160" y="128" width="48"  height="32" rx="9" fill="#FFF3E3"/>
  <rect x="160" y="160" width="96"  height="32" rx="9" fill="#FFF3E3"/>
  <rect x="160" y="192" width="144" height="32" rx="9" fill="#FFF3E3"/>
  <rect x="160" y="224" width="192" height="32" rx="9" fill="#FFC857"/>
  <rect x="160" y="256" width="192" height="32" rx="9" fill="#FFC857"/>
  <rect x="160" y="288" width="144" height="32" rx="9" fill="#FFF3E3"/>
  <rect x="160" y="320" width="96"  height="32" rx="9" fill="#FFF3E3"/>
  <rect x="160" y="352" width="48"  height="32" rx="9" fill="#FFF3E3"/>
</svg>
